name: LinkedIn Recomendadas

# Cron separado do ciclo principal (jobradar.yml, de 3 em 3h) porque esta
# fonte tem uma restrição que as outras não têm: ela bate numa API PRIVADA
# do LinkedIn, autenticada como o usuário. Frequência demais aqui não
# desperdiça tempo de runner — arrisca bloqueio da conta pessoal.
#
# "*/2" no dia do mês dá 1, 3, 5... 31, ou seja, um intervalo de 2 dias que
# encurta pra 1 na virada de mês (31 -> 1). Não é problema: quem garante a
# cadência de verdade é o metadado no banco
# (Perfil.intervalo_baixa_frequencia_dias = 2, ver core/perfis.py). Numa
# virada dessas o código simplesmente pula, e o agendamento se realinha
# sozinho no dia seguinte. O cron aqui é o gatilho; o código é a trava.
#
# Essa divisão importa também porque agendamento não protege de execução
# manual: sem a trava no código, um workflow_dispatch ou um "re-run failed
# jobs" bateria no LinkedIn de novo no mesmo dia.
on:
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch: {}

# MESMO grupo do jobradar.yml, de propósito. Os dois workflows commitam o
# MESMO arquivo (data/jobs.db), e o passo de persistência funciona adotando
# o estado remoto e recolocando por cima a sua própria cópia do banco. Se os
# dois rodassem ao mesmo tempo, o que terminasse por último sobrescreveria
# as vagas gravadas pelo outro — perda silenciosa, que o retry de push NÃO
# pega (o push tem sucesso; o conteúdo é que ficou velho). Serializar no
# grupo elimina a janela inteira.
concurrency:
  group: jobradar-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vagas-recomendadas:
    runs-on: ubuntu-latest
    # Muito menor que os 150 min do ciclo principal: aqui não há navegador
    # nem varredura de termos. São no máximo LINKEDIN_MAX_PAGINAS requisições
    # HTTP com pausa entre elas (~1 min no default de 5 páginas). 10 min já
    # é folga grande; passar disso significa que algo travou.
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sem "playwright install" — diferente do jobradar.yml. Esta fonte é
      # HTTP puro (requests contra a API Voyager), não abre navegador. Baixar
      # o Chromium aqui seria ~1 min e várias centenas de MB por execução,
      # sem uso nenhum.
      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar vagas recomendadas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Canal alternativo ao Telegram: preenchida, o robô posta no
          # webhook de Discord/Slack em vez do Telegram — quem decide é
          # notifier/canal.py, que é o que main.py importa. Secret não
          # cadastrado chega aqui como string vazia, e aí o fallback é o
          # Telegram de sempre; por isso a linha pode existir antes do
          # secret. Sem ela, o canal de webhook funcionaria só no Docker
          # local (que lê o .env) e nunca no Actions, silenciosamente.
          NOTIFICADOR_WEBHOOK_URL: ${{ secrets.NOTIFICADOR_WEBHOOK_URL }}
          # Cookie de sessão da conta do LinkedIn. É credencial pessoal de
          # acesso total — tem que ser secret do repositório, nunca variável
          # de ambiente em texto no arquivo. Ver docs/linkedin-recomendadas.md.
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          # Opcional: normalmente é derivado do li_at em tempo de execução.
          # Só preencher quando a derivação automática falhar.
          LINKEDIN_JSESSIONID: ${{ secrets.LINKEDIN_JSESSIONID }}
        run: python main.py --perfil linkedin --once

      - name: Salvar vagas já vistas (evita notificação duplicada)
        # Mesma estratégia do passo equivalente em jobradar.yml, e o
        # RACIOCÍNIO COMPLETO está lá (incluindo o incidente de 18/08 que
        # motivou trocar o rebase por "adotar o remoto e recolocar só o
        # banco"). Aqui fica só a mecânica, sem repetir a narrativa: manter
        # a explicação em um lugar só evita as duas cópias divergirem.
        #
        # O invariante que importa é o mesmo: qualquer commit gerado aqui
        # contém data/jobs.db e mais nada.
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"

          if [ ! -f data/jobs.db ]; then
            echo "data/jobs.db não existe ao fim do ciclo — nada a salvar."
            exit 1
          fi
          cp data/jobs.db "${RUNNER_TEMP:-/tmp}/jobs.db"

          n=0
          while :; do
            git fetch origin main
            git reset --hard origin/main

            cp "${RUNNER_TEMP:-/tmp}/jobs.db" data/jobs.db
            git add data/jobs.db

            if git diff --cached --quiet; then
              echo "Nada novo pra commitar."
              exit 0
            fi

            git commit -m "chore: atualiza vagas vistas (LinkedIn) [skip ci]"

            if git push; then
              exit 0
            fi

            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "Push falhou depois de 5 tentativas."
              exit 1
            fi
            echo "Push rejeitado, sincronizando (tentativa $n)..."
            sleep $((RANDOM % 5 + 1))
          done
